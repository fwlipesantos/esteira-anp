apiVersion: v1
kind: Service
metadata:
  name: oracle
spec:
  selector:
    app: oracle
  ports:
    - port: 1521
      targetPort: 1521
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          ports:
            - containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anp-oracle
                  key: oracle_senha
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: anp-oracle
                  key: oracle_usuario
            - name: APP_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anp-oracle
                  key: oracle_senha
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 3Gi
          volumeMounts:
            - name: dados
              mountPath: /opt/oracle/oradata
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
