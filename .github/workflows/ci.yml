name: ci

on:
  pull_request:

jobs:
  tarefa:
    runs-on: ubuntu-latest
    steps:
      - name: conferir tarefa vinculada
        env:
          corpo: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$corpo" | grep -Eq '#[0-9]+'; then
            echo "o pull request precisa citar a tarefa, ex: tarefa #12"
            exit 1
          fi

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: esteira-anp
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/precos-anp
          path: precos-anp
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/qualidade-anp
          path: qualidade-anp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: instalar dependencias
        run: |
          pip install "apache-airflow==3.1.0" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt"
          pip install -r esteira-anp/requirements-dev.txt
      - name: lint
        run: ruff check esteira-anp precos-anp qualidade-anp
      - name: testes do pipeline
        working-directory: precos-anp
        run: pytest
      - name: testes de qualidade
        working-directory: qualidade-anp
        run: pytest
      - name: testes das dags
        working-directory: esteira-anp
        env:
          AIRFLOW_HOME: /tmp/airflow
        run: pytest
      - name: construir imagem
        run: docker build -f esteira-anp/Dockerfile -t esteira-anp:teste .
